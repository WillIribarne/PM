<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header.html :: head(tituloPagina='PM - Confirmar Compra')}"></head>
<body>
<nav th:replace="~{navbar.html :: navbar}"></nav>

<div class="container bg-negro p-5 my-5 rounded-5 shadow-lg text-white">
    <h2 class="fw-bolder mb-4 border-bottom pb-3">Confirmar Compra</h2>

    <div class="alert alert-info">
        <h5>Usted ha seleccionado:</h5>
        <h3 class="text-warning" th:text="${producto.nombre}">Nombre Producto</h3>
        <p>Marca: <span th:text="${producto.marca}"></span></p>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <p>Precio del producto: <span class="fw-bold text-success" th:text="'$' + ${producto.precio}"></span></p>
        </div>
        <div class="col-md-6">
            <p>Su saldo disponible: <span class="fw-bold text-success" th:text="'$' + ${perfilLogueado.billetera}"></span></p>
        </div>
    </div>

    <div class="mt-5 d-flex gap-3">
        <form th:action="@{/confirmarCompra}" method="post">
            <input type="hidden" name="id_producto" th:value="${producto.id_producto}">
            <button type="submit" class="btn btn-lg btn-success px-5 fw-bold">Confirmar Compra</button>
        </form>

        <a href="/catalogoTotal" class="btn btn-lg btn-danger px-5 fw-bold">Cancelar</a>
    </div>
</div>
</body>
</html>
