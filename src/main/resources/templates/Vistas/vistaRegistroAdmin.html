<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header.html :: head(tituloPagina='PM - Ventas')}"></head>
<body>
<header th:replace="~{navbar.html :: navbar}"></header>
<div class="container bg-negro p-5 my-5">
    <p class="fuente-botones-index text-white fs-2">Productos Vendidos (Control Admin)</p>
    <div class="table-responsive mt-4">
        <table class="table table-dark table-hover">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Marca</th>
                <th>Precio</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.marca}"></td>
                <td th:text="'$' + ${producto.precio}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="mt-4 text-center">
        <a href="/" class="btn btn-secondary">Volver al Panel</a>
    </div>
</div>
</body>
</html>
