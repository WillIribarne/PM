<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header.html :: head(tituloPagina='PM - Detalle Compra')}"></head>
<body>
<header th:replace="~{navbar.html :: navbar}"></header>
<div class="container bg-negro p-5 my-5">
    <p class="fuente-botones-index text-white fs-2">Detalle de Compra</p>
    <div class="mb-4">
        <span class="badge text-bg-light p-2 m-1">ID: [[${registroCompras.id_compra}]]</span>
        <span class="badge text-bg-light p-2 m-1">Fecha: [[${registroCompras.fecha}]]</span>
        <span class="badge text-bg-success p-2 m-1">Total: $[[${registroCompras.monto}]]</span>
    </div>
    <table class="table table-dark">
        <thead>
        <tr><th>Producto</th></tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${productosSeleccionados}">
            <td th:text="${prod.nombre}"></td>
        </tr>
        </tbody>
    </table>
    <a href="/perfil" class="btn btn-warning mt-3">Volver al perfil</a>
</div>
</body>
</html>
