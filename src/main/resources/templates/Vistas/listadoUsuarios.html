<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header.html :: head(tituloPagina='PM - Catálogo')}"></head>
<body>
<nav th:replace="~{navbar.html :: navbar}"></nav>

<div class="container bg-negro p-5 my-5">
    <span class="fuente-botones-index text-white fs-2">Listado de usuarios registrados</span>
    <div class="table-responsive mt-4">
        <table class="table table-dark table-striped">
            <thead>
            <tr>
                <th>Nombre y apellido</th>
                <th>Fecha Nac.</th>
                <th>Email</th>
                <th>Domicilio</th>
                <th>Teléfono</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="perfil : ${listadoPerfil}">
                <td th:text="${perfil.nombre} + ' ' + ${perfil.apellido}"></td>
                <td th:text="${perfil.fechaNac}"></td>
                <td th:text="${perfil.email}"></td>
                <td th:text="${perfil.domicilio}"></td>
                <td th:text="${perfil.telefono}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
