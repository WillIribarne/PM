<form action="/registro" method="post" class="p-5 m-3">
    <div class="mb-3">
        <label class="form-label text-light">Usuario *</label>
        <input type="text" class="form-control" name="usuario" required>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Contraseña *</label>
        <input type="password" class="form-control" name="clave" required>
    </div>

    <hr class="text-light">

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label text-light">Nombre *</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Apellido *</label>
                <input type="text" class="form-control" name="apellido" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Fecha de Nacimiento *</label>
                <input type="date" class="form-control" name="fecha" required>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label text-light">Email *</label>
                <input type="email" class="form-control" name="correo" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Domicilio *</label>
                <input type="text" class="form-control" name="domicilio" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Número de Teléfono</label>
                <input type="tel" class="form-control" name="tel">
            </div>
        </div>
    </div>

    <div class="form-text text-light my-2">* Campo obligatorio</div>
    <button type="submit" class="btn btn-primary">Registrarse</button>
</form>
