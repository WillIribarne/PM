<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header.html :: head(tituloPagina='PM - Catálogo')}"></head>
<body>
<header th:replace="~{navbar.html :: navbar}"></header>

<div class="container-fluid bg-negro p-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <p class="fuente-botones-index text-white fs-2">
            Catálogo <span th:text="${tipoUser == 2 ? '- Editar productos' : '- Todos los Productos'}"></span>
        </p>

        <div th:if="${tipoUser == 2}">
            <a class="btn btn-warning fw-bold" href="/producto">Agregar Nuevo Producto</a>
        </div>
        <div th:unless="${tipoUser == 2}">
            <a class="btn btn-success" href="/comprar">Ver el carrito</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Marca</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.marca}"></td>
                <td th:text="${producto.descripcion}"></td>
                <td th:text="'$' + ${producto.precio}"></td>
                <td th:text="${producto.stock}"></td>
                <td>
                    <div th:if="${tipoUser == 2}">
                        <form th:action="@{/catalogoropa}" method="post">
                            <button name="valorButton" th:value="${producto.id_producto}" type="submit" class="btn btn-success">Editar producto</button>
                        </form>
                    </div>
                    <div th:unless="${tipoUser == 2}">
                        <form th:action="@{/catalogoropa}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="valorButton" th:value="${producto.id_producto}">
                            <select name="cantidad" class="form-select form-select-sm" style="width: 70px;">
                                <option th:each="i : ${#numbers.sequence(1, producto.stock)}" th:value="${i}" th:text="${i}"></option>
                            </select>
                            <button type="submit" class="btn btn-success btn-sm">Añadir al carrito</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{footer.html :: footer}"></footer>
</body>
</html>
